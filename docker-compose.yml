services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finanzas_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bin/dev
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: finanzas_development
      DATABASE_NAME_TEST: finanzas_test
    volumes:
      - .:/app
    ports:
      # Host 3001 → container 3000 to avoid clashing with other local apps
      # already using port 3000. Open the app at http://localhost:3001
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
